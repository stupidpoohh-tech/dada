<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>남긴 말 — DADA TOWN</title>
<!-- **검색엔진에 올리지 않는다.** 내가 읽는 화면이라 목록에 뜰 이유가 없고,
     열쇠 없이는 아무것도 안 보이지만 주소가 돌아다닐 이유도 없다 -->
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📮</text></svg>">
<link rel="stylesheet" href="styles.css">
<style>
/* 이 화면에서만 쓰는 것들. styles.css의 토큰(--ink · --accent …)을 그대로 쓴다 */
/* **`width: 100%`를 꼭 같이 준다.** styles.css가 마을을 위해 `body`를 세로
   flex로 두는데, 거기서 `margin: 0 auto`를 주면 가로로 늘어나는 대신
   **내용만큼만 좁아진다**(auto 여백이 stretch를 끈다). 그러면 상자는 390px
   화면에서 404px이 되어 폰에서만 가로로 밀린다 — 이 화면에 발자국을 붙이며
   재 보다 알았다(2026-10-07). 넓은 화면에서는 멀쩡해 보인다. */
.ib { width: 100%; max-width: 720px; margin: 0 auto; padding: 26px 16px 60px; }
.ib-head { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; margin-bottom: 4px; }
.ib-head h1 { font-size: 22px; margin: 0; letter-spacing: -.02em; }
.ib-sub { margin: 0 0 20px; color: var(--sub); font-size: 13.5px; }

/* 안 읽은 것이 몇 개인지 — 이 화면에 온 이유가 그것이라 제일 크게 */
.ib-new {
  background: var(--accent); color: var(--accent-ink);
  border-radius: 999px; padding: 3px 11px; font-size: 12.5px; font-weight: 800;
}
.ib-wave { color: var(--faint); font-size: 12.5px; font-weight: 700; }

.ib-key { display: flex; gap: 8px; margin-bottom: 18px; }
.ib-key input {
  flex: 1; min-width: 0; padding: 11px 13px; font-size: 16px;   /* 16px 아래로 내리지 않는다 — iOS가 화면을 확대한다 */
  border: 1px solid var(--line); border-radius: 10px; background: var(--surface-2);
}
.ib-btn {
  border: 0; border-radius: 10px; padding: 11px 16px; cursor: pointer;
  background: var(--accent); color: var(--accent-ink); font-weight: 700; white-space: nowrap;
}
.ib-btn.ghost { background: var(--surface-2); color: var(--sub); }

.ib-msg { color: var(--sub); font-size: 14px; padding: 30px 0; text-align: center; }
.ib-msg.bad { color: #A3402F; }

.ib-list { display: flex; flex-direction: column; gap: 12px; }
.ib-card {
  border: 1px solid var(--line); border-radius: var(--radius);
  padding: 15px 16px; background: var(--surface);
}
/* 안 읽은 것은 왼쪽에 초록 띠 하나. 목록을 훑을 때 눈이 거기서 멈춘다 */
.ib-card.new { border-color: var(--accent); box-shadow: inset 3px 0 0 var(--accent); }
.ib-top { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; margin-bottom: 7px; }
.ib-name { font-weight: 800; font-size: 15px; }
.ib-when, .ib-from { color: var(--faint); font-size: 12px; }
.ib-text { margin: 0; white-space: pre-wrap; font-size: 15px; line-height: 1.65; }
/* 답장받을 곳은 **누를 수 있어야 한다** — 메일이면 메일 앱이, 전화면 전화가 열린다 */
.ib-reply { margin: 10px 0 0; font-size: 13.5px; }
.ib-reply a { color: var(--accent); font-weight: 700; }
.ib-foot { margin-top: 26px; text-align: center; font-size: 13px; }
.ib-foot a { color: var(--accent); }

/* ── 발자국 ─────────────────────────────────────────
   **숫자는 글보다 먼저 거짓말을 한다.** 칸을 예쁘게 채우면 그 자체로 그럴듯해
   보여서, 0인 것이 0으로 안 보이면 알아챌 길이 없다. 그래서 띠는 값이 0이면
   아예 안 그리고, 「앞 칸의 몇 %」를 글자로 같이 적는다. */
.ib-sec { margin-top: 34px; }
/* **자손 선택자여야 한다.** `>`로 두면 「Cloudflare가 더 아는 것」처럼 안쪽
   절에 든 표제가 규칙을 안 받아 브라우저 기본 크기로 혼자 커진다 */
.ib-sec h2 { font-size: 15px; margin: 0 0 10px; letter-spacing: -.01em; }
.ib-note { margin: -4px 0 12px; color: var(--faint); font-size: 12px; line-height: 1.6; }

.ib-tabs { display: flex; gap: 6px; margin-bottom: 14px; }
.ib-tabs button {
  flex: 1; padding: 9px 4px; font-size: 13px; font-weight: 700; cursor: pointer;
  border: 1px solid var(--line); border-radius: 10px;
  background: var(--surface); color: var(--sub);
}
.ib-tabs button[aria-pressed="true"] {
  background: var(--ink); border-color: var(--ink); color: #fff;
}

/* 칸 수를 못 박지 않는다 — 「그 밖에」는 둘뿐이라, 셋으로 고정하면
   빈 칸 하나가 「여기 뭔가 더 있어야 하는데」로 읽힌다 */
.ib-tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(84px, 1fr)); gap: 8px; }
.ib-tile {
  border: 1px solid var(--line); border-radius: 12px; background: var(--surface);
  padding: 14px 10px; text-align: center;
}
.ib-tile b { display: block; font-size: 22px; letter-spacing: -.03em; }
.ib-tile span { display: block; margin-top: 3px; color: var(--faint); font-size: 11.5px; }

.ib-step { border-top: 1px solid var(--line); padding: 11px 0 12px; }
.ib-step:first-child { border-top: 0; }
.ib-step-top { display: flex; align-items: baseline; gap: 8px; font-size: 13.5px; }
.ib-step-top b { margin-left: auto; font-size: 14px; }
.ib-step-top i { font-style: normal; color: var(--faint); font-size: 11.5px; }
.ib-bar { height: 5px; margin-top: 8px; border-radius: 999px; background: var(--surface-2); }
.ib-bar > span { display: block; height: 100%; border-radius: 999px; background: var(--accent); }

/* **칸마다 어디서 온 숫자인지 적는다.** 두 군데서 센 것을 한 화면에 세우면
   몇 달 뒤 내가 그 둘로 비율을 만든다 — 세는 기준도 차단기에 걸리는 비율도
   달라서 그 비율은 아무 뜻이 없다 */
.ib-src { margin: -6px 0 10px; color: var(--faint); font-size: 11.5px; }
.ib-src b { color: var(--sub); font-weight: 700; }
.ib-pair { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 18px; }
.ib-pair h3 { font-size: 13px; margin: 0 0 6px; color: var(--sub); }

.ib-log { margin-top: 10px; font-size: 12px; color: var(--sub); }
.ib-log div { padding: 6px 0; border-top: 1px solid var(--line); display: flex; gap: 10px; }
.ib-log div:first-child { border-top: 0; }
.ib-log time { color: var(--faint); font-variant-numeric: tabular-nums; white-space: nowrap; }
.ib-empty { color: var(--faint); font-size: 13px; padding: 16px 0; text-align: center; }

@media (max-width: 420px) {
  .ib-tile b { font-size: 19px; }
}
</style>
</head>
<body>

<main class="ib">
  <div class="ib-head">
    <h1>📮 남긴 말</h1>
    <span class="ib-new" id="ibNew" hidden></span>
    <span class="ib-wave" id="ibWave"></span>
  </div>
  <p class="ib-sub">마을에 다녀간 사람들이 남긴 것. 이 화면은 나만 본다.</p>

  <form class="ib-key" id="ibKeyForm">
    <input type="password" id="ibKey" placeholder="열쇠(ADMIN_KEY)" autocomplete="current-password"
           aria-label="열쇠">
    <button class="ib-btn" type="submit">열기</button>
    <button class="ib-btn ghost" type="button" id="ibForget" hidden>잊기</button>
  </form>

  <p class="ib-msg" id="ibMsg" hidden></p>
  <div class="ib-list" id="ibList"></div>

  <section class="ib-sec" id="ibFoot" hidden>
    <h2>👣 발자국</h2>
    <p class="ib-note" id="ibFootNote"></p>

    <div class="ib-tabs" id="ibTabs">
      <button type="button" data-days="1" aria-pressed="false">오늘</button>
      <button type="button" data-days="7" aria-pressed="true">7일</button>
      <button type="button" data-days="30" aria-pressed="false">30일</button>
    </div>

    <p class="ib-src" id="ibSrcTop"></p>
    <div class="ib-tiles" id="ibTiles"></div>

    <h2 style="margin-top:26px">어디까지 가다 멈추나</h2>
    <p class="ib-src">출처 <b>발자국</b> — 마을이 직접 센 것. 커스텀 이벤트라 Cloudflare는 모르는 칸이다</p>
    <div id="ibFunnel"></div>

    <h2 style="margin-top:26px">그 밖에</h2>
    <p class="ib-src">출처 <b>발자국</b> — 윗줄 타일과 생김새가 같아서 적어 둔다</p>
    <div class="ib-tiles" id="ibElse"></div>

    <h2 style="margin-top:26px">어디서 들어왔나</h2>
    <p class="ib-src" id="ibSrcRef"></p>
    <div id="ibRef"></div>

    <section id="ibExtra" hidden>
      <h2 style="margin-top:26px">Cloudflare가 더 아는 것</h2>
      <p class="ib-src">출처 <b>Cloudflare</b> — 발자국은 나라도 기기도 안 담는다</p>
      <div class="ib-pair">
        <div><h3>어느 나라에서</h3><div id="ibCountry"></div></div>
        <div><h3>무엇으로</h3><div id="ibDevice"></div></div>
      </div>
    </section>

    <h2 style="margin-top:26px">최근 방문</h2>
    <p class="ib-src">출처 <b>발자국</b> — Cloudflare는 모아 놓은 숫자만 주고 한 줄씩은 안 준다</p>
    <div class="ib-log" id="ibRecent"></div>
  </section>

  <p class="ib-foot"><a href="/">← 마을로 돌아가기</a></p>
</main>

<script>
(() => {
  'use strict';
  const $ = (id) => document.getElementById(id);
  /* 열쇠는 **이 기기에만** 둔다. 주소에 붙이면 방문 기록에 남고, 링크를 남에게
     보내는 순간 같이 간다 — 그 사고를 아예 못 내게 주소에는 안 쓴다. */
  const KEY = 'dada.inboxKey';
  /* 어디까지 읽었는지도 기기마다 따로다. 서버에 두면 「읽음」이 기기 사이를
     따라다녀야 하는데, 혼자 쓰는 화면에 그만한 장치는 과하다. */
  const SEEN = 'dada.inboxSeen';
  const store = {
    get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
    set(k, v) { try { localStorage.setItem(k, v); } catch (e) { /* 사파리 비공개 */ } },
    del(k) { try { localStorage.removeItem(k); } catch (e) { /* 같다 */ } },
  };

  const when = (iso) => {
    const d = new Date(iso);
    if (isNaN(d)) return '';
    const min = Math.floor((Date.now() - d) / 60000);
    if (min < 1) return '방금';
    if (min < 60) return `${min}분 전`;
    if (min < 60 * 24) return `${Math.floor(min / 60)}시간 전`;
    if (min < 60 * 24 * 7) return `${Math.floor(min / 1440)}일 전`;
    return d.toLocaleDateString('ko-KR', { year: '2-digit', month: '2-digit', day: '2-digit' });
  };

  /* 답장받을 곳이 메일인지 번호인지 보고 누를 수 있는 것으로 만든다.
     @가 있으면 메일, 숫자와 기호뿐이면 전화, 나머지는 그냥 글자다 */
  const replyLink = (s) => {
    if (/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(s)) return 'mailto:' + s;
    if (/^[+\d][\d\s.-]{6,}$/.test(s)) return 'tel:' + s.replace(/[\s.-]/g, '');
    return null;
  };

  const el = (tag, cls, text) => {
    const n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text != null) n.textContent = text;   // 남이 쓴 글이다 — 절대 innerHTML로 넣지 않는다
    return n;
  };

  function show(text, bad) {
    const m = $('ibMsg');
    m.textContent = text;
    m.classList.toggle('bad', !!bad);
    m.hidden = !text;
  }

  function render(data) {
    const list = $('ibList');
    list.textContent = '';
    const words = data.words || [];

    /* 어디까지 읽었나 — 마지막으로 본 글의 시각이다. 개수로 세면 오래된 것이
       지워졌을 때 셈이 어긋난다 */
    const seen = store.get(SEEN) || '';
    const fresh = words.filter((w) => (w.at || '') > seen);
    $('ibNew').textContent = `새 글 ${fresh.length}`;
    $('ibNew').hidden = fresh.length === 0;
    $('ibWave').textContent = data.hello ? `손 인사 ${data.hello}` : '';

    if (!words.length) { show('아직 남긴 말이 없어요.'); return; }
    show('');

    words.forEach((w) => {
      const card = el('div', 'ib-card' + ((w.at || '') > seen ? ' new' : ''));
      const top = el('div', 'ib-top');
      top.append(el('span', 'ib-name', w.name || '이름 없이'),
                 el('span', 'ib-when', when(w.at)));
      if (w.from) top.appendChild(el('span', 'ib-from', w.from));
      card.appendChild(top);
      card.appendChild(el('p', 'ib-text', w.text || ''));
      if (w.reply) {
        const p = el('p', 'ib-reply');
        const href = replyLink(w.reply);
        if (href) {
          const a = el('a', null, w.reply);
          a.href = href;
          p.append('답장받을 곳 ', a);
        } else {
          p.textContent = '답장받을 곳 ' + w.reply;
        }
        card.appendChild(p);
      }
      list.appendChild(card);
    });

    /* **본 것은 본 것으로 친다.** 그려 놓고 표시를 안 옮기면 다음에 와도
       같은 것이 새 글로 남아, 「새 글」이라는 말이 곧 아무 뜻도 없어진다.
       띠는 이번 화면에 그대로 남는다 — 방금 무엇이 새로 왔는지는 보여야 하니까 */
    if (words[0] && words[0].at) store.set(SEEN, words[0].at);
  }

  async function load(key) {
    show('여는 중…');
    let res;
    try {
      res = await fetch('/api/word?key=' + encodeURIComponent(key), { cache: 'no-store' });
    } catch (e) {
      show('서버에 닿지 못했어요.', true); return;
    }
    let data = {};
    try { data = await res.json(); } catch (e) { /* 아래에서 상태로 갈린다 */ }

    if (res.status === 403) { show('열쇠가 맞지 않아요.', true); store.del(KEY); return; }
    if (data.error === 'no_admin_key') {
      show('서버에 ADMIN_KEY가 아직 없어요 — 시크릿을 먼저 넣어 주세요.', true); return;
    }
    if (data.error === 'not_configured') { show('KV가 아직 안 붙어 있어요.', true); return; }
    if (!data.ok) { show('읽지 못했어요.', true); return; }

    store.set(KEY, key);
    $('ibForget').hidden = false;
    $('ibKey').value = '';
    $('ibKey').placeholder = '열쇠 기억함';
    waveDays = data.days || [];      // 손 인사 — 발자국 칸이 기간을 맞춰 더한다
    render(data);
    loadHits(key);                   // 글과 따로 받는다. 한쪽이 늦어도 다른 쪽은 보인다
  }

  $('ibKeyForm').addEventListener('submit', (e) => {
    e.preventDefault();
    const key = $('ibKey').value.trim() || store.get(KEY);
    if (!key) { show('열쇠를 넣어 주세요.', true); return; }
    load(key);
  });

  $('ibForget').addEventListener('click', () => {
    store.del(KEY);
    $('ibForget').hidden = true;
    $('ibKey').placeholder = '열쇠(ADMIN_KEY)';
    $('ibList').textContent = '';
    $('ibNew').hidden = true;
    $('ibWave').textContent = '';
    $('ibFoot').hidden = true;
    $('ibExtra').hidden = true;
    hits = null;
    show('열쇠를 잊었어요.');
  });

  /* ── 발자국 ─────────────────────────────────────────
     `/api/hits`가 주는 것은 하루치 덩이뿐이다. 더하고 나누는 것은 여기서 한다 —
     서버가 미리 더해 주면 기간 탭을 누를 때마다 다시 물어야 한다.

     **깔때기 네 칸은 세션 단위, 방문 횟수는 쪽을 연 수다.** 단위가 다른 둘을 한
     막대에 겹쳐 놓으면 「방문 13번 중 열람 2명」처럼 읽혀 비율이 거짓이 된다.
     그래서 깔때기의 맨 윗칸은 방문 횟수가 아니라 **다녀간 사람**이다. */
  const DAYS = 'dada.inboxDays';
  /* **맨 윗칸 이름을 타일과 다르게 둔다.** 타일의 「다녀간 사람」은 Cloudflare가
     센 것이고 여기는 발자국이 센 것이라 **숫자가 다르다.** 같은 이름으로 두면
     한 화면에 같은 말이 두 숫자로 서서, 둘 중 하나가 틀린 것처럼 보인다 */
  const FUNNEL = [
    ['people', '마을에 들어옴'],
    ['view', '프로젝트를 열어봄'],
    ['say', '한마디 창을 엶'],
    ['sent', '한마디를 남김'],
  ];
  let hits = null;      // 마지막으로 받아 온 것 (탭만 바꿀 때 다시 안 묻는다)

  const sum = (days, k) => days.reduce((n, d) => n + (Number(d[k]) || 0), 0);

  function tile(box, rows) {
    box.textContent = '';
    rows.forEach(([n, label]) => {
      const t = el('div', 'ib-tile');
      t.append(el('b', null, String(n)), el('span', null, label));
      box.appendChild(t);
    });
  }

  /** 한 칸. **0이면 띠를 아예 안 그린다** — 1px짜리 띠가 남아 있으면
   *  「조금은 있다」로 보이고, 0은 0으로 보여야 다음에 무엇을 고칠지 알 수 있다. */
  function step(box, label, n, base, baseLabel) {
    const row = el('div', 'ib-step');
    const top = el('div', 'ib-step-top');
    top.appendChild(el('span', null, label));
    const pct = base > 0 ? Math.round((n / base) * 100) : 0;
    top.appendChild(el('b', null, `${n}번`));
    if (baseLabel) top.appendChild(el('i', null, `${baseLabel} ${pct}%`));
    row.appendChild(top);
    const bar = el('div', 'ib-bar');
    if (n > 0 && base > 0) {
      const fill = el('span');
      fill.style.width = Math.max(2, Math.min(100, pct)) + '%';
      bar.appendChild(fill);
    }
    row.appendChild(bar);
    box.appendChild(row);
  }

  /** 출처 한 줄. **이 줄이 없으면 두 숫자가 한 출처처럼 보인다** */
  function src(node, [who, why]) {
    node.textContent = '출처 ';
    node.appendChild(el('b', null, who));
    node.append(' — ' + why);
  }

  /** `{이름: 수}`를 많은 순으로 띠로 세운다. 들어온 곳·나라·기기가 같은 모양이다 */
  function bars(box, obj, empty) {
    const rows = Object.entries(obj || {}).filter(([, n]) => n > 0)
      .sort((a, b) => b[1] - a[1]);
    box.textContent = '';
    if (!rows.length) { box.appendChild(el('p', 'ib-empty', empty)); return; }
    const most = rows[0][1];
    rows.forEach(([k, n]) => step(box, k === '-' ? '바로 들어옴' : k, n, most, ''));
  }

  /** 하루치 덩이에 들어 있는 `{이름: 수}` 칸을 기간만큼 더한다 */
  function tally(win, key) {
    const out = {};
    win.forEach((d) => Object.entries(d[key] || {}).forEach(([k, n]) => {
      out[k] = (out[k] || 0) + n;
    }));
    return out;
  }

  function drawHits(days) {
    /* 탭 표시를 **그릴 때마다 맞춘다.** 기억해 둔 기간으로 처음 그릴 때
       마크업에 적어 둔 기본값(7일)이 그대로 눌린 채로 남아, 30일을 보고 있는데
       7일이 켜져 있는 화면이 된다 */
    [...$('ibTabs').children].forEach((b) =>
      b.setAttribute('aria-pressed', String(Number(b.dataset.days) === days)));
    const win = hits.days.slice(0, days);
    const got = (k) => sum(win, k);

    /* ── 윗줄 숫자는 **Cloudflare 것을 먼저 쓴다.** 쿠키를 안 심는 비콘이라
       차단기에 덜 걸려서 「몇 명 왔나」는 이쪽이 더 참값에 가깝다. 안 켜져
       있으면 발자국 숫자로 서고, 어느 쪽인지 바로 아래 줄에 적는다 */
    const cf = hits.cf && hits.cf.ok ? hits.cf : null;
    const from = win[win.length - 1] ? win[win.length - 1].day : '';
    const cfIn = (k) => (cf ? cf.days.filter((d) => d.day >= from)
      .reduce((n, d) => n + (Number(d[k]) || 0), 0) : 0);

    tile($('ibTiles'), [
      [cf ? cfIn('visits') : got('people'), '다녀간 사람'],
      [cf ? cfIn('views') : got('visit'), '방문 횟수'],
      [waveIn(win), '손 인사'],
    ]);
    src($('ibSrcTop'), cf
      ? ['Cloudflare', '쿠키를 안 심는 비콘이라 차단기에 덜 걸린다. 「다녀간 사람」은 밖에서 들어온 수(visits)다']
      : ['발자국', !hits.cf
          ? 'Worker가 아직 옛 판이다 — 배포가 돌고 나면 Cloudflare 숫자가 섞인다'
          : hits.cf.error === 'not_configured'
            ? 'Cloudflare 쪽은 시크릿 셋(CF_API_TOKEN · CF_ACCOUNT_ID · CF_SITE_TAG)을 넣으면 켜진다'
            : 'Cloudflare를 못 읽었다 — ' + hits.cf.error]);

    const box = $('ibFunnel');
    box.textContent = '';
    const top = got('people');
    FUNNEL.forEach(([k, label], i) => {
      step(box, label, got(k), i === 0 ? top : got(FUNNEL[i - 1][0]),
        i === 0 ? '' : '앞 칸의');
    });

    /* 깔때기에 이미 선 칸은 여기 다시 세우지 않는다 — 같은 숫자가 두 군데
       있으면 더해도 되는 것처럼 보인다 */
    tile($('ibElse'), [
      [got('list'), '목록을 엶'],
      [got('tour'), '투어 시작'],
    ]);

    /* 들어온 곳. `-`는 주소를 바로 치거나 북마크로 온 것이다 —
       카카오톡·메모장처럼 어디서 왔는지 안 알려 주는 곳도 여기 섞인다.

       **Cloudflare 것이 있으면 그쪽을 쓴다.** 다만 기간은 못 자른다 — 그쪽
       숫자는 날짜별로 안 오고 묶음으로 오므로, 받아 온 창(30일) 전체다.
       그래서 출처 줄에 그 말을 적어 둔다 */
    bars($('ibRef'), cf ? cf.ref : tally(win, 'ref'), '아직 들어온 길이 없어요.');
    src($('ibSrcRef'), cf
      ? ['Cloudflare', '이 칸만 기간 탭을 안 따른다 — 받아 온 30일 전체다']
      : ['발자국', '빈 referrer는 「바로 들어옴」으로 묶었다']);

    if (cf) {
      bars($('ibCountry'), cf.country, '아직 없어요.');
      bars($('ibDevice'), cf.device, '아직 없어요.');
    }
    $('ibExtra').hidden = !cf;

    const log = $('ibRecent');
    log.textContent = '';
    const recent = hits.recent || [];
    if (!recent.length) log.appendChild(el('p', 'ib-empty', '아직 기록이 없어요.'));
    recent.forEach((r) => {
      const row = el('div');
      const t = el('time', null, new Date(r.at).toLocaleString('ko-KR',
        { month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit' }));
      t.dateTime = r.at;
      row.append(t, el('span', null, r.from === '-' ? '바로 들어옴' : r.from));
      log.appendChild(row);
    });

    $('ibFootNote').textContent =
      '숫자가 두 군데서 온다 — 윗줄과 「어디서 들어왔나」는 Cloudflare, 깔때기와 '
      + '최근 방문은 마을이 직접 센 발자국이다. 세는 기준이 달라 둘을 더하거나 '
      + '서로 나누면 안 된다. 깔때기 네 칸은 브라우저 세션에 한 번씩만 세므로 '
      + '같은 사람이 내일 또 오면 두 번 센다. '
      + '내 방문(?dada=dev)과 ?gadebug로 들어온 것은 발자국에 아예 안 담긴다.';
    $('ibFoot').hidden = false;
  }

  /* 손 인사는 예전부터 `/api/word`가 날짜별로 주고 있다 — 발자국과 따로 세는
     것이라 여기서 기간만 맞춰 더한다 */
  let waveDays = [];
  const waveIn = (win) => {
    const from = win[win.length - 1] && win[win.length - 1].day;
    if (!from) return 0;
    return waveDays.filter((d) => d.day >= from).reduce((n, d) => n + d.n, 0);
  };

  async function loadHits(key) {
    let res;
    try {
      res = await fetch('/api/hits?key=' + encodeURIComponent(key) + '&days=30',
        { cache: 'no-store' });
    } catch (e) { return; }                      // 발자국이 안 보이는 것으로 글까지 막지 않는다
    let data = {};
    try { data = await res.json(); } catch (e) { /* 아래에서 걸러진다 */ }
    if (!data.ok) return;                        // 아직 새 Worker가 안 떠 있을 수도 있다
    hits = data;
    drawHits(Number(store.get(DAYS)) || 7);
  }

  $('ibTabs').addEventListener('click', (e) => {
    const b = e.target.closest('button[data-days]');
    if (!b || !hits) return;
    store.set(DAYS, b.dataset.days);
    [...$('ibTabs').children].forEach((x) => x.setAttribute('aria-pressed', String(x === b)));
    drawHits(Number(b.dataset.days));
  });

  // 기억해 둔 열쇠가 있으면 바로 연다 — 올 때마다 넣게 하면 안 오게 된다
  const saved = store.get(KEY);
  if (saved) { $('ibForget').hidden = false; $('ibKey').placeholder = '열쇠 기억함'; load(saved); }
})();
</script>

</body>
</html>
