<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>DADA TOWN — 만든 것들이 사는 마을</title>
<meta name="description" content="이다원이 만든 앱과 작업물을 모아둔 픽셀 마을. 건물을 눌러 둘러보세요.">
<meta property="og:type" content="website">
<meta property="og:title" content="DADA TOWN — 만든 것들이 사는 마을">
<meta property="og:description" content="이다원이 만든 앱과 작업물을 모아둔 픽셀 마을. 건물을 눌러 둘러보세요.">
<meta property="og:url" content="https://dada-portfolio.stupidpoohh.workers.dev/">
<meta property="og:image" content="https://dada-portfolio.stupidpoohh.workers.dev/assets/map/town-web.jpg">
<meta property="og:image:width" content="1792">
<meta property="og:image:height" content="1434">
<meta property="og:site_name" content="DADA TOWN">
<meta property="og:locale" content="ko_KR">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏘️</text></svg>">
<link rel="preload" as="image" href="assets/map/town-web.jpg">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<header class="topbar">
  <div class="brand">
    <h1 class="wordmark">DADA TOWN</h1>
    <p class="tagline">만든 것들이 사는 마을</p>
  </div>
</header>

<main class="stage" id="stage">
  <div class="map-holder">
    <div class="map" id="map">
      <img class="map-img" id="mapImg" src="assets/map/town-web.jpg"
           alt="DADA TOWN 마을 지도. 미술관, 학교, 성균관 한옥, 공원, 회사, 카페, 은행, 세모집이 도로로 이어져 있습니다."
           width="1792" height="1434" fetchpriority="high">
      <div class="layer sky" id="sky" aria-hidden="true"></div>
      <div class="layer road" id="road" aria-hidden="true"></div>
      <div class="layer folks" id="folks" aria-hidden="true"></div>
      <div class="layer hotspots" id="hotspots"></div>
    </div>
    <div class="panel-wrap" id="panelWrap" hidden>
      <section class="panel" id="panel" tabindex="-1" aria-live="polite"></section>
    </div>

    <div class="book-overlay" id="bookOverlay" hidden role="dialog" aria-modal="true"
         aria-label="아트 포트폴리오" tabindex="-1">
      <div class="book-bar">
        <strong class="book-title">아트 포트폴리오</strong>
        <span class="book-count"><b id="bkCur">1</b> / <span id="bkTotal">11</span></span>
        <button type="button" class="icon-btn" id="bkClose" aria-label="닫기">✕</button>
      </div>
      <div class="book" id="bk">
        <div class="leaf" id="bkLeaf"><img id="bkImg" alt=""></div>
        <button type="button" class="zone prev" id="bkPrev" aria-label="이전 쪽"><span aria-hidden="true">‹</span></button>
        <button type="button" class="zone next" id="bkNext" aria-label="다음 쪽"><span aria-hidden="true">›</span></button>
      </div>
      <nav class="book-strip" id="bkStrip" aria-label="쪽 이동"></nav>
    </div>

  </div>

  <p class="hint" id="hint">건물을 눌러 그 안의 작업물을 볼 수 있어요.</p>

  <div class="actions">
    <div class="picks-wrap">
      <button type="button" class="picks-btn" id="picksBtn" aria-expanded="false">
        <span aria-hidden="true">⭐</span> 추천 픽
      </button>
      <section class="picks-panel" id="picksPanel" hidden aria-label="추천 서비스">
        <div class="picks-head">
          <strong>⭐ 이것부터 보세요</strong>
          <button type="button" class="icon-btn" id="closePicks" aria-label="닫기">✕</button>
        </div>
        <div id="picksBody"></div>
      </section>
    </div>
    <button type="button" class="list-btn" id="openList" aria-haspopup="dialog">
      <span aria-hidden="true">☰</span> 웹서비스 한눈에 보기
    </button>
  </div>
</main>

<footer class="site-footer">
  <p class="foot-name" id="footName"></p>
  <p class="foot-contact" id="footContact"></p>
</footer>

<div class="modal-backdrop" id="modal" hidden>
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle" tabindex="-1">
    <div class="modal-head">
      <h2 id="modalTitle">웹서비스 한눈에 보기</h2>
      <button type="button" class="icon-btn" id="closeList" aria-label="닫기">✕</button>
    </div>
    <div class="modal-tools">
      <input type="search" id="search" placeholder="이름이나 설명으로 검색" aria-label="검색" autocomplete="off">
      <div class="chips" id="chips" role="group" aria-label="종류 필터"></div>
    </div>
    <div class="modal-body" id="modalBody"></div>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
